# Local end-to-end test rig for n8n-nodes-job-opportunities-api.
# Throwaway n8n bound to 127.0.0.1 only. The packed tarball is extracted into ./nodes/node_modules,
# the same layout "Settings > Community Nodes > Install" produces. See run-e2e.sh.
name: joan8n

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: joan8n-n8n
    restart: 'no'
    ports:
      - '127.0.0.1:5679:5678'
    environment:
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_HIRING_BANNER_ENABLED: 'false'
      N8N_SECURE_COOKIE: 'false'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'true'
      N8N_LOG_LEVEL: info
    volumes:
      - joan8n_data:/home/node/.n8n
      - ./nodes:/home/node/.n8n/nodes
      - ./workflows:/opt/joa/workflows:ro
    mem_limit: 1536m

volumes:
  joan8n_data:
